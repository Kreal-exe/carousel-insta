/* Layout: слева текст и правки, справа — лента готовых слайдов 1080×1350. Интерфейс — тёмная «монтажная», слайды — в своей палитре. */
:root {
  --ui-bg: #151311;
  --ui-panel: #1d1a17;
  --ui-raise: #26221e;
  --ui-line: #342e28;
  --ui-text: #efe7dc;
  --ui-muted: #a89c8c;
  --ui-gold: #cfa86e;
  --ui-danger: #ef7f6c;
  --f-ui: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-head: "Tenor Sans", "Montserrat", Georgia, serif;
  --f-body: "Montserrat", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ui-bg); color: var(--ui-text); font: 14px/1.5 var(--f-ui); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ui-gold); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); min-height: 100%; }
.side { background: var(--ui-panel); border-right: 1px solid var(--ui-line); padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; }
.brand h1 { margin: 0; font: 400 22px/1.2 var(--f-head); letter-spacing: .02em; }
.brand span { color: var(--ui-muted); font-size: 12px; }
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ui-muted); font-weight: 600; }
textarea, input[type=text], select {
  width: 100%; background: #110f0d; border: 1px solid var(--ui-line); border-radius: 10px; padding: 10px 12px; outline: none;
}
textarea:focus, input[type=text]:focus, select:focus { border-color: var(--ui-gold); }
#src { min-height: 280px; resize: vertical; line-height: 1.55; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--ui-line); background: var(--ui-raise); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 13px; }
.btn:hover:not(:disabled) { border-color: #4a4138; }
.btn:disabled { opacity: .5; cursor: default; }
.btn-gold { background: var(--ui-gold); border-color: var(--ui-gold); color: #1c140a; }
.btn-gold:hover:not(:disabled) { background: #dcb67c; }
.btn-wide { width: 100%; padding: 12px; font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--ui-line); background: transparent; border-radius: 99px; padding: 5px 11px; font-size: 12px; color: var(--ui-muted); }
.chip:hover { color: var(--ui-text); border-color: var(--ui-gold); }
.status { font-size: 12.5px; color: var(--ui-muted); min-height: 1.5em; }
.status.err { color: var(--ui-danger); }
.status.busy::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ui-gold); margin-right: 8px; animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: .25; } }
.note { font-size: 12px; color: var(--ui-muted); background: var(--ui-raise); border: 1px solid var(--ui-line); border-radius: 10px; padding: 10px 12px; }
.themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.theme { border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-raise); padding: 6px; display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--ui-muted); }
.theme.on { border-color: var(--ui-gold); color: var(--ui-text); }
.theme i { display: flex; height: 22px; border-radius: 6px; overflow: hidden; }
.theme i b { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--ui-line); margin: 4px 0; width: 100%; }

.main { min-width: 0; padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 14px; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.bar .count { color: var(--ui-muted); font-size: 13px; }
.gallery { display: flex; flex-wrap: wrap; gap: 22px 18px; }
.card { display: flex; flex-direction: column; gap: 8px; }
.frame { width: calc(1080px * var(--s)); height: calc(1350px * var(--s)); overflow: hidden; border-radius: 6px; box-shadow: 0 14px 40px rgba(0,0,0,.45); position: relative; }
.frame > .slide { transform: scale(var(--s)); transform-origin: 0 0; }
.tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: calc(1080px * var(--s)); }
.tools select { width: auto; padding: 5px 8px; font-size: 12px; border-radius: 8px; flex: 1 1 150px; min-width: 0; }
.tools button { border: 1px solid var(--ui-line); background: var(--ui-raise); border-radius: 8px; padding: 5px 9px; font-size: 12px; color: var(--ui-muted); }
.tools button:hover:not(:disabled) { color: var(--ui-text); border-color: #4a4138; }
.tools .btn-file { border: 1px solid var(--ui-line); background: var(--ui-raise); border-radius: 8px; padding: 5px 9px; font-size: 12px; color: var(--ui-gold); cursor: pointer; }
.tools .btn-file:hover { border-color: var(--ui-gold); }
.tools .n { font-size: 12px; color: var(--ui-muted); font-variant-numeric: tabular-nums; width: 20px; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .side { border-right: 0; border-bottom: 1px solid var(--ui-line); }
  .main { padding: 16px; }
}

/* ============ Слайд 1080×1350: все размеры — пиксели итогового PNG ============ */
.slide { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--text); font-family: var(--f-body); -webkit-font-smoothing: antialiased; --fit: 1; }
.bg { position: absolute; inset: 0; background: radial-gradient(120% 70% at 35% 20%, var(--bg1) 0%, transparent 62%), linear-gradient(172deg, var(--bg1) 0%, var(--bg2) 100%); }
.zone { position: absolute; left: 88px; right: 88px; top: 170px; bottom: 170px; display: flex; flex-direction: column; justify-content: center; }
.stack { display: flex; flex-direction: column; gap: calc(38px * var(--fit)); }
.h { margin: 0; font: 400 calc(var(--hs) * var(--fit)) / 1.16 var(--f-head); letter-spacing: .012em; color: var(--text); white-space: pre-line; }
.h .hl, .boxb .hl, .big .hl { color: var(--accent); }
.p { margin: 0; font-weight: 300; font-size: calc(40px * max(var(--fit), .72)); line-height: 1.4; color: var(--muted); white-space: pre-line; }
.p .hl, .quote .hl, .boxs .hl, .li .hl, .lead .hl { font-weight: 600; color: var(--text); }
.lead { margin: 0; font-weight: 300; font-size: calc(42px * max(var(--fit), .72)); line-height: 1.3; color: var(--text); opacity: .85; }
.rule { background: var(--line); }
.quote { border-left: 2px solid var(--line); padding: 6px 0 6px 40px; display: flex; flex-direction: column; gap: 22px; }
.quote p { margin: 0; font-weight: 300; font-size: calc(40px * max(var(--fit), .72)); line-height: 1.35; color: var(--text); }
.box { background: var(--box); border-radius: 22px; padding: 44px 48px; display: flex; flex-direction: column; gap: 14px; }
.boxs { margin: 0; font-weight: 300; font-size: calc(38px * max(var(--fit), .72)); line-height: 1.35; color: var(--muted); }
.boxb { margin: 0; font: 400 calc(60px * var(--fit)) / 1.18 var(--f-head); letter-spacing: .012em; color: var(--text); }
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 92px 1fr; align-items: baseline; padding: 26px 0; border-top: 1px solid var(--line); font-weight: 300; font-size: calc(40px * max(var(--fit), .72)); line-height: 1.32; color: var(--text); }
.li:last-child { border-bottom: 1px solid var(--line); }
.li em { font: 400 34px/1 var(--f-head); color: var(--accent); font-style: normal; letter-spacing: .08em; }
.big { margin: 0; font: 400 calc(260px * var(--fit)) / .9 var(--f-head); color: var(--accent); letter-spacing: -.01em; }

<script>
// ---------- Палитры ----------
const THEMES = {
  mocha: { name: "Крем и шоколад",
    light: { bg1: "#f8f4ee", bg2: "#e8dbc5", text: "#2a1f17", muted: "#5b4b3e", accent: "#8a6a3a" },
    dark:  { bg1: "#3b2a20", bg2: "#211812", text: "#f3e9dc", muted: "#c9b8a4", accent: "#d9b98f" } },
  olive: { name: "Олива",
    light: { bg1: "#f4f2e9", bg2: "#e3e0cd", text: "#23261b", muted: "#555a45", accent: "#6e7a3f" },
    dark:  { bg1: "#2f3325", bg2: "#1a1d14", text: "#eef0e4", muted: "#bfc3ad", accent: "#c9d38f" } },
  graphite: { name: "Графит",
    light: { bg1: "#f5f5f3", bg2: "#e2e2de", text: "#1b1b1b", muted: "#555555", accent: "#7a6247" },
    dark:  { bg1: "#2b2b2d", bg2: "#141415", text: "#f2f2f0", muted: "#b5b5b5", accent: "#d8c3a5" } },
};

const LAYOUTS = {
  cover: "Обложка",
  statement: "Крупная мысль",
  text: "Заголовок + линия + текст",
  box: "Заголовок + плашка",
  quote: "Цитата с линией",
  list: "Список",
  number: "Крупная цифра",
  art: "Графика / фото + текст",
  photo: "Фото на весь слайд",
  cta: "Призыв (финал)",
};

// ---------- Демо: тексты автора, разложенные заранее ----------
const DEMO_SVG_THREAD = `<svg viewBox="0 0 800 800" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle class="soft" cx="430" cy="420" r="210"/><path d="M40 560 C180 560 250 520 320 470 C390 420 420 330 380 290 C340 250 270 300 300 370 C330 440 440 460 520 420 C600 380 640 300 760 260"/><path class="accent" d="M380 290 C420 260 470 280 470 330 C470 380 410 390 390 360"/><circle class="dot" cx="760" cy="260" r="7"/></svg>`;
const DEMO_SVG_HOURGLASS = `<svg viewBox="0 0 800 800" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle class="soft" cx="400" cy="400" r="250"/><path d="M270 150 H530 M270 650 H530"/><path d="M300 150 C300 320 395 350 395 400 C395 450 300 480 300 650"/><path d="M500 150 C500 320 405 350 405 400 C405 450 500 480 500 650"/><path class="accent" d="M330 250 C370 270 430 270 470 250 C450 320 410 350 400 380 C390 350 350 320 330 250Z"/><path class="accent" d="M400 400 V590" stroke-dasharray="2 14"/><path class="accent" d="M320 650 C350 600 450 600 480 650"/></svg>`;

const DEMO_TEXT = `Ты это и так знаешь сама, но всё время забываешь, что…

Твоя внутренняя удовлетворённость и правда с собой важнее, чем одобрение других.

Твои сомнения в себе — это проверка, а не правда.

Если ты не отдыхаешь — ты эксплуатируешь себя. А значит, будешь чувствовать себя использованной.

Скроллинг ленты — это не отдых. Он не восстанавливает. Он сжигает твой главный ресурс. Даже два главных ресурса: время и внимание.

Когда внимание тебе не принадлежит, ты ощущаешь, что другие люди тебя не ценят.

Оно у мужчины, который опять не ответил на сообщение. У мамы, которая опять не так посмотрела. У коллеги. У ленты. У завтрашнего дня. А себе мы отдаём то, что осталось после всех. И потом удивляемся, что с нами обращаются так же :)

26 сентября начинаем открытую неделю практики — возвращаем своё внимание вовнутрь. Напиши «Хочу» в комментариях, и тебе придёт ссылка на телеграм-канал, где будут все материалы.`;

const DEMO_SLIDES = [
  { layout: "cover", tone: "dark", title: "Ты это и так знаешь сама,", body: "но всё время\n**забываешь**, что…", art: { idea: "тонкая нить, завязанная узелком на память", svg: DEMO_SVG_THREAD } },
  { layout: "statement", tone: "light", title: "Твоя внутренняя удовлетворённость и правда с собой **важнее, чем одобрение других.**" },
  { layout: "statement", tone: "dark", title: "Твои сомнения в себе — это **проверка,**\nа не правда." },
  { layout: "text", tone: "light", title: "Если ты не отдыхаешь — ты **эксплуатируешь себя.**", body: "А значит, будешь чувствовать себя **использованной.**" },
  { layout: "art", tone: "dark", title: "Скроллинг ленты — это **не отдых.**", body: "Он сжигает два главных ресурса: **время и внимание.**", art: { idea: "песочные часы, из которых утекает песок", svg: DEMO_SVG_HOURGLASS } },
  { layout: "statement", tone: "light", lead: "Когда внимание тебе не принадлежит,", title: "ты ощущаешь, что **другие люди тебя не ценят.**" },
  { layout: "quote", tone: "dark", items: ["Оно у мужчины, который опять не ответил на сообщение.", "У мамы, которая опять не так посмотрела.", "У коллеги. У ленты. У завтрашнего дня."], note: "И потом удивляемся, что с нами обращаются так же :)", big: "А себе мы отдаём то, **что осталось после всех.**" },
  { layout: "cta", tone: "dark", title: "**26 сентября**\nначинаем открытую неделю практики — **возвращаем своё внимание вовнутрь.**", body: "Напиши **«Хочу»** в комментариях, и тебе придёт ссылка на телеграм-канал, где будут все материалы." },
];

// ---------- Состояние ----------
const uid = () => Math.random().toString(36).slice(2, 9);
const withIds = (arr) => arr.map((s) => ({ id: uid(), ...s }));
let state = { text: DEMO_TEXT, slides: withIds(DEMO_SLIDES), theme: "mocha", handle: "@sveta_dubinskaya_master" };
try {
  const saved = JSON.parse(localStorage.getItem("carousel-studio") || "null");
  if (saved && Array.isArray(saved.slides) && saved.slides.length) state = { ...state, ...saved };
} catch (e) {}
const save = () => { try { localStorage.setItem("carousel-studio", JSON.stringify(state)); } catch (e) {} };

// ---------- Текст: экранирование, **акцент**, неразрывные пробелы ----------
const SHORT = /(^|[\s(«"])(в|во|к|ко|с|со|у|о|об|от|до|за|из|на|по|не|ни|и|а|но|да|или|для|без|при|про|над|под|что|как)\s+/gi;
function esc(s) { return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function rich(s) {
  let t = esc(s).replace(SHORT, "$1$2 ").replace(SHORT, "$1$2 ").replace(/\s+([—–])\s/g, " $1 ").replace(/(\d+)\s+(?=[^\s\d])/g, "$1 ");
  return t.replace(/\*\*(.+?)\*\*/gs, '<span class="hl">$1</span>');
}
const plainLen = (s) => String(s ?? "").replace(/\*\*/g, "").length;

// ---------- SVG от Claude: только безопасные элементы ----------
const SVG_OK = new Set(["svg", "g", "path", "circle", "ellipse", "line", "polyline", "polygon", "rect", "defs", "lineargradient", "radialgradient", "stop"]);
function cleanSvg(raw) {
  const m = String(raw || "").match(/<svg[\s\S]*<\/svg>/i);
  if (!m) return "";
  // без xmlns SVG не откроется как картинка (нужно для самопроверки рисунка)
  const src = /xmlns=/.test(m[0].slice(0, m[0].indexOf(">"))) ? m[0] : m[0].replace(/^<svg/i, '<svg xmlns="http://www.w3.org/2000/svg"');
  const doc = new DOMParser().parseFromString(src, "image/svg+xml");
  const root = doc.documentElement;
  if (!root || root.nodeName.toLowerCase() !== "svg" || doc.querySelector("parsererror")) return "";
  const walk = (el) => {
    for (const child of [...el.children]) {
      if (!SVG_OK.has(child.nodeName.toLowerCase())) { child.remove(); continue; }
      walk(child);
    }
    for (const a of [...el.attributes]) {
      const n = a.name.toLowerCase();
      if (n.startsWith("on") || n === "style" || n.includes("href")) el.removeAttribute(a.name);
    }
  };
  walk(root);
  root.removeAttribute("width"); root.removeAttribute("height");
  if (!root.getAttribute("viewBox")) root.setAttribute("viewBox", "0 0 800 800");
  if (!root.getAttribute("fill")) root.setAttribute("fill", "none");
  if (!root.getAttribute("stroke")) root.setAttribute("stroke", "currentColor");
  return new XMLSerializer().serializeToString(root);
}

// ---------- Рендер слайда ----------
const ARROW = `<svg class="arrow" width="106" height="14" viewBox="0 0 106 14" fill="none"><path d="M0 7h104M97 1l7 6-7 6" stroke="currentColor" stroke-width="1.6"/></svg>`;

// Цвета акцентов вписываем прямо в атрибуты SVG — так они гарантированно попадают в PNG
function paintSvg(svg, pal) {
  const doc = new DOMParser().parseFromString(svg, "image/svg+xml");
  doc.querySelectorAll(".accent").forEach((el) => el.setAttribute("stroke", pal.accent));
  doc.querySelectorAll(".soft").forEach((el) => { el.setAttribute("fill", pal.accent); el.setAttribute("fill-opacity", "0.12"); el.setAttribute("stroke", "none"); });
  doc.querySelectorAll(".hatch").forEach((el) => { el.setAttribute("stroke-width", "1.2"); el.setAttribute("stroke-opacity", "0.6"); });
  doc.querySelectorAll(".shade").forEach((el) => { el.setAttribute("fill", "currentColor"); el.setAttribute("fill-opacity", "0.1"); el.setAttribute("stroke", "none"); });
  doc.querySelectorAll(".dot").forEach((el) => { el.setAttribute("fill", pal.accent); el.setAttribute("stroke", "none"); });
  const root = doc.documentElement;
  root.setAttribute("width", "100%"); root.setAttribute("height", "100%");
  return new XMLSerializer().serializeToString(root);
}

function artBlock(s, box, pal) {
  const pos = `left:${box[0]}px;top:${box[1]}px;width:${box[2]}px;height:${box[3]}px`;
  if (s.art?.svg) return `<div class="art" style="${pos}">${paintSvg(s.art.svg, pal)}</div>`;
  if (s.art) return `<div class="art-wait" style="${pos}">${s.art.pending ? (s.art.stage || "рисую…") : "нет графики"}</div>`;
  return "";
}

function slideHTML(s, i, n) {
  const pal = THEMES[state.theme][s.tone === "light" ? "light" : "dark"];
  const hLen = plainLen(s.title);
  const hs = s.layout === "cover" ? (hLen > 60 ? 76 : hLen > 36 ? 88 : 100)
           : s.layout === "list" ? 64
           : hLen > 150 ? 58 : hLen > 90 ? 66 : 76;
  const vars = `--bg1:${pal.bg1};--bg2:${pal.bg2};--text:${pal.text};--muted:${pal.muted};--accent:${pal.accent};--line:${pal.accent}8c;--box:${s.tone === "light" ? "rgba(60,40,20,.06)" : "rgba(255,255,255,.075)"};--artc:${pal.text}d9;--hs:${hs}px`;
  const h = s.title ? `<h2 class="h">${rich(s.title)}</h2>` : "";
  const lead = s.lead ? `<p class="lead">${rich(s.lead)}</p>` : "";
  const p = s.body ? `<p class="p">${rich(s.body)}</p>` : "";
  const rule = `<div class="rule" style="width:120px;height:2px"></div>`;
  const box = (s.note || s.big) ? `<div class="box">${s.note && s.layout !== "quote" ? `<p class="boxs">${rich(s.note)}</p>` : ""}${s.big ? `<p class="boxb">${rich(s.big)}</p>` : ""}${s.note && s.layout === "quote" ? `<p class="boxs">${rich(s.note)}</p>` : ""}</div>` : "";
  let inner = "", extra = "", cls = "";
  switch (s.layout) {
    case "cover":
      if (s.photo) { cls = "cover photo"; extra = photoBg(s); }
      else { cls = s.art ? "cover" : "cover noart"; extra = s.art ? artBlock(s, [140, 110, 800, 520], pal) : ""; }
      inner = h + p;
      break;
    case "photo":
      cls = "photo"; extra = s.photo ? photoBg(s) : `<div class="art-wait" style="left:140px;top:160px;width:800px;height:560px">перетащите фото</div>`;
      inner = lead + h + p;
      break;
    case "text": inner = lead + h + rule + p; break;
    case "box": inner = lead + h + p + box; break;
    case "quote": inner = `<div class="quote">${(s.items || []).map((t) => `<p>${rich(t)}</p>`).join("")}</div>` + h + box; break;
    case "list": inner = h + `<div class="list">${(s.items || []).map((t, k) => `<div class="li"><em>${String(k + 1).padStart(2, "0")}</em><span>${rich(t)}</span></div>`).join("")}</div>` + p; break;
    case "number": inner = `<p class="big">${rich(s.big || "")}</p>` + h + p; break;
    case "art":
      cls = "artlay";
      extra = s.photo
        ? `<div class="artph" style="left:140px;top:150px;width:800px;height:560px"><img src="${s.photo}" alt="" style="width:800px;height:560px;object-position:50% ${s.focus ?? 40}%"></div>`
        : artBlock(s, [200, 150, 680, 560], pal);
      inner = h + p;
      break;
    case "cta": inner = h + rule + p; break;
    default: inner = lead + h + p;
  }
  const last = i === n - 1;
  return `<div class="slide ${cls}" style="${vars}" data-i="${i}">
    <div class="bg"></div>${extra}
    <div class="zone"><div class="stack">${inner}</div></div>
    ${s.layout !== "cover" && !(s.layout === "photo" && i === 0) ? `<div class="counter">${String(i + 1).padStart(2, "0")} / ${String(n).padStart(2, "0")}</div>` : ""}
    <div class="foot ${last ? "c" : ""}"><span class="handle">${esc(state.handle)}</span>${last ? "" : ARROW}</div>
  </div>`;
}

function photoBg(s) {
  return `<img class="ph" src="${s.photo}" alt="" style="width:1080px;height:1350px;object-position:50% ${s.focus ?? 40}%">${state.haze === false ? "" : '<div class="haze"></div>'}<div class="shade"></div>`;
}

// Подгонка: уменьшаем кегль, пока текст не влезет в свою зону
function fit(slideEl) {
  let f = 1;
  const zone = slideEl.querySelector(".zone"), stack = slideEl.querySelector(".stack");
  slideEl.style.setProperty("--fit", 1);
  for (let k = 0; k < 10 && stack.offsetHeight > zone.offsetHeight; k++) {
    f = Math.round(f * 0.92 * 100) / 100;
    slideEl.style.setProperty("--fit", f);
  }
}

// ---------- Галерея ----------
const gallery = document.getElementById("gallery");
function scaleFor() {
  const w = gallery.clientWidth || 600;
  const cols = w < 560 ? 1 : w < 900 ? 2 : Math.max(3, Math.floor((w + 18) / 348));
  const cardW = Math.min(w < 560 ? w : 340, Math.floor((w - 18 * (cols - 1)) / cols) - 1);
  gallery.style.setProperty("--s", (cardW / 1080).toFixed(4));
}
new ResizeObserver(scaleFor).observe(gallery);

function render() {
  scaleFor();
  const n = state.slides.length;
  gallery.innerHTML = state.slides.map((s, i) => `
    <div class="card" data-id="${s.id}">
      <div class="frame">${slideHTML(s, i, n)}</div>
      <div class="tools">
        <span class="n">${i + 1}</span>
        <select aria-label="Макет слайда ${i + 1}" data-act="layout">${Object.entries(LAYOUTS).map(([k, v]) => `<option value="${k}" ${k === s.layout ? "selected" : ""}>${v}</option>`).join("")}</select>
        <button data-act="tone" title="Светлый / тёмный фон">${s.tone === "light" ? "☀" : "☾"}</button>
        <label class="btn-file" title="Своё фото (можно просто перетащить на слайд)"><input type="file" accept="image/*" data-act="photo" hidden>${s.photo ? "другое фото" : "+ фото"}</label>
        ${s.photo ? `<button data-act="nophoto" title="Убрать фото">✕ фото</button>` : `<button data-act="art" ${aiReady ? "" : "disabled"} title="Графика по смыслу">${s.art ? "перерисовать" : "+ графика"}</button>`}
        ${s.art && !s.photo ? `<button data-act="noart" title="Убрать графику">✕</button>` : ""}
        ${s.art && !s.photo ? `<input class="idea" type="text" data-act="idea" value="${esc(s.art.idea)}" placeholder="что нарисовать, например: лестница вверх" aria-label="Что нарисовать на слайде ${i + 1}">` : ""}
        <button data-act="png" title="Скачать PNG">PNG</button>
        ${s.photo ? `<input type="range" min="0" max="100" value="${s.focus ?? 40}" data-act="focus" aria-label="Кадр фото по вертикали" title="Сдвиг кадра">` : ""}
      </div>
    </div>`).join("");
  gallery.querySelectorAll(".slide").forEach(fit);
  document.getElementById("count").textContent = `${n} ${n % 10 === 1 && n % 100 !== 11 ? "слайд" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? "слайда" : "слайдов"} · 1080×1350`;
  save();
}

// ---------- Свои фото ----------
// Уменьшаем до 1350px по длинной стороне: так файл лёгкий, а качество для 1080×1350 то же
function readPhoto(file) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith("image/")) return reject();
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

function normalize(list) {
  if (!Array.isArray(list)) throw { code: "invalid_json" };
  return list.slice(0, 20).map((s) => ({
    id: uid(),
    layout: LAYOUTS[s.layout] ? s.layout : "statement",
    tone: s.tone === "light" ? "light" : "dark",
    lead: String(s.lead || ""), title: String(s.title || ""), body: String(s.body || ""),
    items: Array.isArray(s.items) ? s.items.map(String).filter(Boolean) : [],
    note: String(s.note || ""), big: String(s.big || ""),
    art: s.art && s.art.idea ? { idea: String(s.art.idea), redraw: !!s.art.redraw } : null,
  }));
}

// Графику рисуем по две параллельно, остальные ждут
let artQueue = [], artRunning = 0;
function drawArt(s, fresh = false) {
  s.art = { ...s.art, svg: fresh ? "" : s.art?.svg || "", pending: true };
  render();
  artQueue.push({ s, fresh });
  pumpArt();
}
// SVG → PNG, чтобы Claude мог посмотреть на свой рисунок
function svgToPng(svg) {
  return new Promise((resolve, reject) => {
    const doc = new DOMParser().parseFromString(paintSvg(svg, { accent: "#9a6b2f" }), "image/svg+xml");
    const root = doc.documentElement;
    root.setAttribute("width", "800"); root.setAttribute("height", "800"); root.setAttribute("color", "#2a1f17");
    const painted = new XMLSerializer().serializeToString(root);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      c.width = c.height = 800;
      const x = c.getContext("2d");
      x.fillStyle = "#fbf7f1"; x.fillRect(0, 0, 800, 800);
      x.drawImage(img, 0, 0, 800, 800);
      c.toBlob((b) => (b ? resolve(b) : reject()), "image/png");
    };
    img.onerror = reject;
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(painted);
  });
}

async function makeArt(s, fresh) {
  const ctx = [s.lead, s.title, s.body, s.big].map(plain).filter(Boolean).join(" ");
  if (!s.art.idea.trim()) {
    const { text } = await sample(`Назови один конкретный узнаваемый предмет или простую сцену для иллюстрации к фразе: «${ctx}». ${IDEA_RULE} Ответ — только это описание, 3–10 слов.`, { modelTier: "quick" });
    s.art.idea = text.trim().replace(/^[«"]|[»".]$/g, "");
  }
  const { text } = await sample(artPrompt(s.art.idea, ctx), fresh ? { modelTier: "complex", cache: false } : { modelTier: "complex" });
  let svg = cleanSvg(text);
  if (!svg) throw { code: "invalid_json" };
  if (canSeeImages) {
    try {
      s.art.stage = "проверяю рисунок…"; renderSoon();
      const png = await svgToPng(svg);
      const review = await sample(reviewPrompt(s.art.idea, svg), { images: png, cache: false });
      if (!/^\s*OK\b/i.test(review.text)) svg = cleanSvg(review.text) || svg;
    } catch (e) {
      if (e?.code === "not_granted" || e?.code === "rate_limited") throw e;
    }
  }
  return svg;
}

let renderTimer = 0;
function renderSoon() { clearTimeout(renderTimer); renderTimer = setTimeout(render, 50); }

function pumpArt() {
  while (artRunning < 2 && artQueue.length) {
    const { s, fresh } = artQueue.shift();
    artRunning++;
    makeArt(s, fresh)
      .then((svg) => { s.art = { idea: s.art.idea, svg }; })
      .catch((e) => { s.art = { idea: s.art.idea, svg: "" }; setStatus("Графика: " + errText(e), "err"); })
      .finally(() => {
        artRunning--;
        render();
        const left = artQueue.length + artRunning;
        if (left && !statusEl.classList.contains("err")) setStatus(`Рисую графику, осталось: ${left}…`, "busy");
        if (!left && !statusEl.classList.contains("err")) setStatus("Готово. Правьте словами или меняйте макеты под слайдами.");
        pumpArt();
      });
  }
}

    render();

applyBtn.addEventListener("click", async () => {

  if (!instruction) { setStatus("Напишите, что поменять.", "err"); return; }
  goBtn.disabled = applyBtn.disabled = true;
  setStatus("Claude вносит правку…", "busy");
  try {
    const old = state.slides;
    const data = await sample.json(editPrompt(instruction), { cache: false });
    const next = normalize(data.slides);
    // сохраняем нарисованную графику, если образ не меняли
    next.forEach((s, i) => {
      if (!s.art) return;
      const prevArt = old.find((o) => o.art?.svg && o.art.idea === s.art.idea)?.art || (old[i]?.art?.svg && !s.art.redraw && old[i].art.idea === s.art.idea ? old[i].art : null);
      if (prevArt && !s.art.redraw) s.art = { idea: s.art.idea, svg: prevArt.svg };
    });
    // фото переносим на слайды, где Claude оставил hasPhoto (по порядку)
    const photos = old.filter((x) => x.photo).map((x) => ({ photo: x.photo, focus: x.focus }));
    data.slides.forEach((raw, i) => { if (raw.hasPhoto && photos.length) { Object.assign(next[i], photos.shift()); next[i].art = null; } });
    // страховка: если Claude потерял отметки, фото остаются на слайдах с теми же номерами
    if (photos.length === old.filter((x) => x.photo).length) {
      old.forEach((o, i) => { if (o.photo && next[i]) { next[i].photo = o.photo; next[i].focus = o.focus; next[i].art = null; if (!["cover", "art", "photo"].includes(next[i].layout)) next[i].layout = i === 0 ? "cover" : "photo"; } });
    }
    state.slides = next;
    editEl.value = "";
    render();
    const toDraw = next.filter((s) => s.art && !s.art.svg);
    setStatus(toDraw.length ? `Правка внесена. Рисую графику: ${toDraw.length}…` : "Правка внесена.", toDraw.length ? "busy" : "");
    toDraw.forEach((s) => drawArt(s, true));
  } catch (e) {
    setStatus(errText(e), "err");
  } finally {
    goBtn.disabled = applyBtn.disabled = false;
  }
});

async function exportOne(s) {
  if (!downloads) { setStatus("Скачивание доступно, когда страница открыта в Claude.", "err"); return; }
  try {
    setStatus("Готовлю PNG…", "busy");
    const blob = await pngBlob(s);
    await downloads.save({ filename: `slide-${String(state.slides.indexOf(s) + 1).padStart(2, "0")}.png`, data: blob });
    setStatus("PNG сохранён.");
  } catch (e) { setStatus(e?.code === "declined" ? "Скачивание отменено." : "Не удалось сохранить PNG.", "err"); }
}
document.getElementById("dlZip").addEventListener("click", async () => {
  if (!downloads) { setStatus("Скачивание доступно, когда страница открыта в Claude.", "err"); return; }
  try {
    setStatus("Собираю архив…", "busy");
    const zip = new JSZip();
    for (const [i, s] of state.slides.entries()) zip.file(`slide-${String(i + 1).padStart(2, "0")}.png`, await pngBlob(s));
    await downloads.save({ filename: "carousel.zip", data: await zip.generateAsync({ type: "blob" }) });
    setStatus("Архив сохранён.");
  } catch (e) { setStatus(e?.code === "declined" ? "Скачивание отменено." : "Не удалось собрать архив.", "err"); }
});

// ---------- Старт ----------
renderThemes();
render();
document.fonts?.ready.then(render);
(async () => {
  const c = window.claude;
  if (!c?.use) { document.getElementById("aiNote").hidden = false; goBtn.disabled = applyBtn.disabled = true; return; }
  const [s, d] = await Promise.all([c.use("sample"), c.use("downloads")]);
  sample = s; downloads = d; aiReady = !!s;
  if (s) canSeeImages = !!(await s.limits().catch(() => null))?.images;
  if (!aiReady) { document.getElementById("aiNote").hidden = false; goBtn.disabled = applyBtn.disabled = true; }
  render();
})();
</script>
